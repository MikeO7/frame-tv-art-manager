repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-json
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: detect-private-key
    -   id: check-case-conflict
    -   id: mixed-line-ending

-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -   id: gitleaks

-   repo: local
    hooks:
    -   id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: \.go$
        pass_filenames: false

    -   id: anti-slop-hygiene
        name: AI anti-slop and code hygiene
        entry: ./scripts/check-anti-slop.sh
        language: script
        pass_filenames: false

    -   id: pages-site
        name: GitHub Pages site validation
        entry: python3 scripts/validate-pages-site.py
        language: system
        files: ^(docs/site/|scripts/validate-pages-site\.py$|\.github/workflows/pages\.yml$)
        pass_filenames: false
