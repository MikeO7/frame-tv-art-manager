name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

# Cancel superseded runs on the same ref so new pushes don't queue behind
# stale work, dramatically reducing time-to-green during rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lane 0: Pre-commit Hook Consistency
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: go.sum
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Lane 1: Lint + workflow validation (merged to avoid a separate runner spin-up)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: actionlint
        uses: reviewdog/action-actionlint@v1

  # Lane 2: Test, build, coverage, and security (govulncheck runs in parallel with tests)
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Test, Coverage & Security
        run: |
          set +e
          govulncheck ./... &
          vuln_pid=$!
          make coverage-check GO_TEST_FLAGS="-race -count=1 -shuffle=on" GO_TEST_VERBOSE=
          test_status=$?
          wait "$vuln_pid"
          vuln_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          exit "$vuln_status"
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
      - name: Build
        run: go build -o frame-tv-art-manager ./cmd/frame-tv-art-manager
