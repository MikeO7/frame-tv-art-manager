name: Go Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - '**.go'

permissions:
  contents: write

# Only the latest main state matters for the dependency graph, so cancel
# any in-flight submission superseded by a newer push.
concurrency:
  group: dep-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go Environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Submit Dependencies
        uses: actions/go-dependency-submission@e2170f625f1e00ff60ca2ac4f14056a4e1ad9783 # v2.0.3
        with:
          go-mod-path: go.mod
          go-build-target: cmd/frame-tv-art-manager/main.go
