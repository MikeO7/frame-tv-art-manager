name: Go Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - '**.go'

permissions:
  contents: write

# Only the latest main state matters for the dependency graph, so cancel
# any in-flight submission superseded by a newer push.
concurrency:
  group: dep-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go Environment
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Submit Dependencies
        uses: actions/go-dependency-submission@v2
        with:
          go-mod-path: go.mod
          go-build-target: cmd/frame-tv-art-manager/main.go
