linters:
  enable:
    - gosec
    - revive
    - misspell
    - unconvert
    - goconst
    - gocyclo
    - asciicheck
    - bodyclose
    - dupl
    - gocritic
    - goprintffuncname
    - nakedret
    - prealloc
    - unparam
    - funlen
    - gocognit
    - nestif
    - lll
    - errcheck
    - unused
    - gofumpt
    - copyloopvar
    - predeclared
    - usestdlibvars
    - errname
    - errorlint
    - nilerr
    - nilnil
    - whitespace
    - nolintlint

linters-settings:
  gocyclo:
    min-complexity: 12
  gocognit:
    min-complexity: 15
  nestif:
    min-complexity: 3
  funlen:
    lines: 60
    statements: 35
  lll:
    line-length: 150
  goconst:
    min-len: 3
    min-occurrences: 3
  revive:
    rules:
      - name: exported
        disabled: true
      - name: argument-limit
        arguments: [5]
      - name: function-result-limit
        arguments: [3]
      - name: file-length-limit
        arguments:
          - max: 300

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude test files from structural limits (function length and complexity)
    - path: _test\.go
      linters:
        - funlen
        - gocognit
        - gocyclo
        - dupl
        - lll
        - revive # Exclude revive checks on test files so they are not constrained by file-length
    
    # Exclude brightness package astronomical/solar equations from complexity and length checks
    - path: internal/brightness/
      linters:
        - funlen
        - gocognit
        - gocyclo
