version: "2"
run:
  tests: true
linters:
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dupl
    - errname
    - errorlint
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    funlen:
      lines: 60
      statements: 35
    gocognit:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 12
    lll:
      line-length: 150
    nestif:
      min-complexity: 3
    revive:
      rules:
        - name: exported
          disabled: true
        - name: argument-limit
          arguments:
            - 5
        - name: function-result-limit
          arguments:
            - 3
        - name: file-length-limit
          arguments:
            - max: 1000
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - gocognit
          - gocyclo
          - lll
          - revive
        path: _test\.go
      - linters:
          - funlen
          - gocognit
          - gocyclo
        path: internal/brightness/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
